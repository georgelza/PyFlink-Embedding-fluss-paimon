
configs:
  flink-conf:
    file: conf/flink/config.yaml

  log4j:
    file: conf/log4j/log4j.properties
  log4j-console:
    file: conf/log4j/log4j-console.properties
  log4j-session:
    file: conf/log4j/log4j-session.properties

  postgres_conf:
    file: conf/pg/postgresql.conf
  postgres_hba:
    file: conf/pg/pg_hba.conf


services:
  ################################################################################
  # begin Flink cluster
  #
  # Lots of Jar's added to the base image, Fluss, JDBC, PostgreSQL, Paimon, S3
  ################################################################################
  jobmanager:
    image: ${REPO_NAME}/apacheflink-1.20.2-scala_2.12-java17:1.0.4
    hostname: jobmanager
    container_name: jobmanager
    ports:
      - 8084:8081

    deploy:
      resources:
          limits:
            memory: 6G

    environment:
      - ENV_ROOTLOG_LEVEL=DEBUG
      - ENV_FLINKLOG_LEVEL=INFO
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_DEFAULT_REGION=${AWS_REGION}

    volumes:
      - flink_flows:/creFlinkFlows
      - flink_pyflink:/pyflink

      - flink_logs:/opt/flink/log
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_rocksdb:/opt/flink/rocksdb
    configs:
      - source: flink-conf
        target: /opt/flink/conf/config.yaml
      - source: log4j
        target: /opt/flink/conf/log4j.properties
      - source: log4j-console
        target: /opt/flink/conf/log4j-console.properties
      - source: log4j-session
        target: /opt/flink/conf/log4j-session.properties
    command: jobmanager

  taskmanager:
    image: ${REPO_NAME}/apacheflink-1.20.2-scala_2.12-java17:1.0.4
    depends_on:
      - jobmanager
    deploy:
      replicas: 1
      resources:
          limits:
            memory: 12G  # Ensure this is higher than taskmanager.memory.process.size
                         # Also make sure this aligns with the config file value specified for the taskmanager => memory.process.size: 12gb 

    environment:
      - ENV_ROOTLOG_LEVEL=INFO
      - ENV_FLINKLOG_LEVEL=INFO
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_DEFAULT_REGION=${AWS_REGION}

    volumes:
      - ./creFlinkFlows:/creFlinkFlows
      - ./pyflink:/pyflink
      
      - ./data/flink/logs:/opt/flink/log
      - ./data/flink/checkpoints:/opt/flink/checkpoints
      - ./data/flink/rocksdb:/opt/flink/rocksdb
    configs:
      - source: flink-conf
        target: /opt/flink/conf/config.yaml
      - source: log4j
        target: /opt/flink/conf/log4j.properties
      - source: log4j-console
        target: /opt/flink/conf/log4j-console.properties
      - source: log4j-session
        target: /opt/flink/conf/log4j-session.properties
    command: taskmanager


  ################################################################################
  # Will act as a destination store from where we will CDC our data to be embedded
  ################################################################################
  postgrescdc:
    image: postgres:15
    hostname: postgrescdc
    container_name: postgrescdc
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=demog
      - POSTGRES_USER=dbadmin
      - POSTGRES_PASSWORD=dbpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d demog"]
      interval: 10s
      timeout: 5s
      retries: 5    
    volumes:
      - ./data/postgrescdc:/var/lib/postgresql/data
      - ./sql/postgrescdc:/docker-entrypoint-initdb.d
    configs:
      - source: postgres_conf
        target: /etc/postgresql/postgresql.conf
      - source: postgres_hba
        target: /etc/postgresql/data/pg_hba.conf
    command: -c config_file=/etc/postgresql/postgresql.conf

  postgrescat:
    image: postgres:15
    hostname: postgrescat
    container_name: postgrescat
    restart: unless-stopped
    ports:
      - 5433:5432
    environment:
      - POSTGRES_DB=catalogs
      - POSTGRES_USER=dbadmin
      - POSTGRES_PASSWORD=dbpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d catalogs"]
      interval: 10s
      timeout: 5s
      retries: 5    
    volumes:
      - ./data/postgrescat:/var/lib/postgresql/data
      - ./sql/postgrescat:/docker-entrypoint-initdb.d
    configs:
      - source: postgres_conf
        target: /etc/postgresql/postgresql.conf
      - source: postgres_hba
        target: /etc/postgresql/data/pg_hba.conf
    command: -c config_file=/etc/postgresql/postgresql.conf

  ################################################################################
  # Begin Fluss cluster
  ################################################################################
  coordinator-server:
    image: georgelza/fluss_0.8.0-incubating:1.0.0
    hostname: coordinator-server
    container_name: coordinator-server
    depends_on:
      - postgrescdc
      - zookeeper
    environment:
      - |
        FLUSS_PROPERTIES=
          zookeeper.address                             : zookeeper:2181
          bind.listeners                                : INTERNAL://coordinator-server:9124, CLIENT://coordinator-server:9123
          advertised.listeners                          : INTERNAL://coordinator-server:9124, CLIENT://coordinator-server:9123
          internal.listener.name                        : INTERNAL
          
          # Lakehouse store and catalog both on FS
          datalake.enabled                              : true
          datalake.format                               : paimon
          datalake.paimon.warehouse                     : /tmp/paimon

          # FS Based Catalogs
          datalake.paimon.metastore                     : filesystem


    ports:
      - "9123:9123"
    volumes:
      - ./data/fluss/cs/local-data:/tmp/local-data
      - ./data/fluss/cs/remote-data:/tmp/remote-data
      - ./data/fluss/paimon:/tmp/paimon
      - ./data/fluss/iceberg:/tmp/iceberg
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9123/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    command: ["bin/coordinator-server.sh", "start-foreground"]

  # Fluss Tablet Server 1
  tablet-server-1:
    image: georgelza/fluss_0.8.0-incubating:1.0.0
    hostname: tablet-server-1
    container_name: tablet-server-1
    depends_on:
      - coordinator-server
    ports:
      - "9124:9124"
    environment:
      - |
        FLUSS_PROPERTIES=
          zookeeper.address                             : zookeeper:2181
          bind.listeners                                : INTERNAL://tablet-server-1:9124, CLIENT://tablet-server-1:9123
          advertised.listeners                          : INTERNAL://tablet-server-1:9124, CLIENT://tablet-server-1:9123
          internal.listener.name                        : INTERNAL
          tablet-server.id                              : 1
          coordinator.host                              : coordinator-server
          coordinator.port                              : 9123
          log.segment.file-size                         : 10MB
          kv.snapshot.interval                          : 0s

          data.dir                                      : /tmp/local-data
          remote.data.dir                               : /tmp/remote-data
          
          # Lakehouse store and catalog both on FS
          datalake.enabled                              : true
          datalake.format                               : paimon
          datalake.paimon.warehouse                     : /tmp/paimon

          # FS Based Catalogs
          datalake.paimon.metastore                     : filesystem

    volumes:
      - ./data/fluss/ts1/local-data:/tmp/local-data
      - ./data/fluss/ts1/remote-data:/tmp/remote-data
      - ./data/fluss/paimon:/tmp/paimon
      - ./data/fluss/iceberg:/tmp/iceberg
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9124/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    command: ["bin/tablet-server.sh", "start-foreground"]

  # Fluss Tablet Server 2
  tablet-server-2:
    image: georgelza/fluss_0.8.0-incubating:1.0.0
    hostname: tablet-server-2
    container_name: tablet-server-2
    depends_on:
      - coordinator-server
    ports:
      - "9125:9124"
    environment:
      - |
        FLUSS_PROPERTIES=
          zookeeper.address                             : zookeeper:2181
          bind.listeners                                : INTERNAL://tablet-server-2:9124, CLIENT://tablet-server-2:9123
          advertised.listeners                          : INTERNAL://tablet-server-2:9124, CLIENT://tablet-server-2:9123
          internal.listener.name                        : INTERNAL
          tablet-server.id                              : 2
          coordinator.host                              : coordinator-server
          coordinator.port                              : 9123
          log.segment.file-size                         : 10MB
          kv.snapshot.interval                          : 0s

          data.dir                                      : /tmp/local-data
          remote.data.dir                               : /tmp/remote-data
          
          # Lakehouse store and catalog both on FS
          datalake.enabled                              : true
          datalake.format                               : paimon
          datalake.paimon.warehouse                     : /tmp/paimon

          # FS Based Catalogs
          datalake.paimon.metastore                     : filesystem

    volumes:
      - ./data/fluss/ts2/local-data:/fluss/local-data
      - ./data/fluss/ts2/remote-data:/fluss/remote-data
      - ./data/fluss/paimon:/tmp/paimon
      - ./data/fluss/iceberg:/tmp/iceberg
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9124/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    command: ["bin/tablet-server.sh", "start-foreground"]

  # Fluss Tablet Server 3
  tablet-server-3:
    image: georgelza/fluss_0.8.0-incubating:1.0.0
    hostname: tablet-server-3
    container_name: tablet-server-3
    depends_on:
      - coordinator-server
    ports:
      - "9126:9124"
    environment:
      - |
        FLUSS_PROPERTIES=
          zookeeper.address                             : zookeeper:2181
          bind.listeners                                : INTERNAL://tablet-server-3:9124, CLIENT://tablet-server-3:9123
          advertised.listeners                          : INTERNAL://tablet-server-3:9124, CLIENT://tablet-server-3:9123
          internal.listener.name                        : INTERNAL
          tablet-server.id                              : 3
          coordinator.host                              : coordinator-server
          coordinator.port                              : 9123
          log.segment.file-size                         : 10MB
          kv.snapshot.interval                          : 0s

          data.dir                                      : /tmp/local-data
          remote.data.dir                               : /tmp/remote-data
          # or
          # remote.data.dir                             : s3://warehouse/paimon

          # Lakehouse store and catalog both on FS
          datalake.enabled                              : true
          datalake.format                               : paimon
          datalake.paimon.warehouse                     : /tmp/paimon

          # FS Based Catalogs
          datalake.paimon.metastore                     : filesystem

          # JDBC Catalog, storage on FS
          # datalake.paimon.type                        : paimon
          # datalake.paimon.metastore                   : jdbc          
          # datalake.paimon.catalog-key                 : jdbc
          # datalake.paimon.uri                         : jdbc:postgresql://postgrescat:5432/catalogs?currentSchema=paimon_jdbc
          # datalake.paimon.jdbc.user                   : dbadmin
          # datalake.paimon.jdbc.password               : dbpassword
          # datalake.paimon.jdbc.driver                 : org.postgresql.Driver          
          # datalake.paimon.table-default.file.format   : parquet


          # Paimon
          # datalake.format                             : paimon
          # datalake.paimon.type                        : paimon

          # FS Storage
          # datalake.paimon.metastore                   : filesystem

          # S3 Storage
          # datalake.paimon.warehouse                   : s3://warehouse/paimon
          # datalake.paimon.s3.endpoint                 : http://minio:9000
          # datalake.paimon.s3.access-key               : mnadmin
          # datalake.paimon.s3.secret-key               : mnpassword
          # datalake.paimon.s3.region                   : af-south-1
          # datalake.paimon.s3.path.style.access        : true
          # datalake.paimon.table-default.file.format   : parquet



          # Iceberg
          # datalake.format                             : iceberg
          # datalake.iceberg.type                       : iceberg

          # FS Storage
          # datalake.iceberg.metastore                  : filesystem
          # datalake.iceberg.metastore                  : /tmp/iceberg

          # S3 Storage
          # datalake.iceberg.warehouse                  : s3://warehouse/iceberg
          # datalake.iceberg.s3.endpoint                : http://minio:9000
          # datalake.iceberg.s3.access-key              : mnadmin
          # datalake.iceberg.s3.secret-key              : mnpassword
          # datalake.iceberg.s3.region                  : af-south-1
          # datalake.iceberg.s3.path.style.access       : true
          # datalake.iceberg.table-default.file.format  : parquet



          # Lance
          # datalake.format                             : lance
          # datalake.lance.type                         : lance
          
          # FS Storage
          # datalake.lance.metastore                    : filesystem
          # datalake.lance.metastore                    : /tmp/lance

          # S3 Storage
          # datalake.lance.warehouse                    : s3://warehouse/iceberg
          # datalake.lance.s3.endpoint                  : http://minio:9000
          # datalake.lance.s3.access-key                : mnadmin
          # datalake.lance.s3.secret-key                : mnpassword
          # datalake.lance.s3.region                    : af-south-1
          # datalake.lance.s3.path.style.access         : true
          # datalake.lance.table-default.file.format    : parquet


    volumes:
      - ./data/fluss/ts3/local-data:/tmp/local-data
      - ./data/fluss/ts3/remote-data:/tmp/remote-data
      - ./data/fluss/paimon:/tmp/paimon
      - ./data/fluss/iceberg:/tmp/iceberg
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9124/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    command: ["bin/tablet-server.sh", "start-foreground"]

  # ZooKeeper for Fluss coordination
  zookeeper:
    image: zookeeper:3.9.2
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181
    volumes:
      - ./data/zk/data:/data
      - ./data/zk/datalogs:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5



################################################################################
# The below volume based approach with driver_opts gives you more control
# but requires the directories to exist before starting Docker Compose.
# implies precreating the directory using mkdir in say the Makefile

volumes:
  # The most common, standard used at the top here, less used, more project specific lower dow
  # or defined inside the service to make it more self contained.

  # Pre existing
  flink_flows:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./creFlinkFlows
  flink_pyflink:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./pyflink  

  # Flink
  flink_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/flink/logs
  flink_checkpoints:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/flink/checkpoints
  flink_rocksdb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/flink/rocksdb

  # Fluss

  # Zookeeper, as part of Fluss
  zk_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/zk/data
  zk_datalogs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/zk/datalogs


################################################################################
# Without a network explicitly defined, you hit this Hive/Thrift error
# java.net.URISyntaxException Illegal character in hostname
# https://github.com/TrivadisPF/platys-modern-data-platform/issues/231
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}
